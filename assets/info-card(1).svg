<text x="285" y="238" class="m" font-size="13">
<tspan class="label">automation</tspan><tspan class="value">   Endpoint • Remediation • Installers</tspan>
</text>
<text x="398" y="260" class="m value" font-size="13">Agentic • Workflows</text>

<text x="285" y="288" class="m" font-size="13">
