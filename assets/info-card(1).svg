<line x1="285" y1="330" x2="780" y2="330" stroke="#6f8f79" opacity=".5"/>

<text x="285" y="354" class="m" font-size="12" fill="#b7ffcf">
$ whoami <tspan class="value">Software Engineer</tspan><tspan class="cursor">█</tspan>
